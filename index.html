<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVTH - Lowest Prices, Best Quality Shopping App</title>
  <meta name="description" content="Shop on EVTH for lowest prices on sarees, kurtis, men fashion and electronics with free delivery.">
  <meta name="keywords" content="EVTH, EVTH shopping, EVTH app, online shopping, meesho clone">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #212121;
    }

    .hero-banner {
      background: linear-gradient(135deg, #f43397, #ff6b81);
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-bottom: 20px;
    }

    .hero-banner h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 15px 50px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #f43397;
    }

    .search-bar {
      width: 40%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .cart-btn,
    .add-btn {
      background: #f43397;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-btn {
      padding: 10px 18px;
    }

    .categories {
      display: flex;
      gap: 15px;
      padding: 15px 50px;
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
    }

    .categories button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .categories button.active {
      background: #f43397;
      color: white;
      border-color: #f43397;
    }

    .products-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 30px 50px;
    }

    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 330px;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
    }

    .product-title {
      font-size: 16px;
      margin: 10px 0 5px;
      color: #333;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      color: #212121;
    }

    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-top: 5px;
      font-weight: bold;
    }

    .add-btn {
      margin-top: 10px;
      padding: 8px;
    }

    .cart-btn:hover,
    .add-btn:hover,
    .categories button:hover {
      opacity: 0.88;
    }

    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
        padding: 14px 20px;
      }

      .search-bar {
        order: 3;
        width: 100%;
      }

      .categories,
      .products-container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .products-container {
        gap: 15px;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }

      .product-card img {
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">EVTH</div>
    <input
      type="text"
      id="searchInput"
      class="search-bar"
      placeholder="Try Saree, Kurti or Search by Product Code"
      aria-label="Search products"
    >
    <button class="cart-btn" type="button">Cart (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero-banner">
    <h1>Welcome to EVTH</h1>
    <p>Lowest Prices • Free Delivery • Easy Returns</p>
  </section>

  <nav class="categories" aria-label="Product categories">
    <button class="cat-btn active" type="button" data-category="All">All</button>
    <button class="cat-btn" type="button" data-category="Women">Women Fashion</button>
    <button class="cat-btn" type="button" data-category="Men">Men Fashion</button>
    <button class="cat-btn" type="button" data-category="Electronics">Electronics</button>
  </nav>

  <main class="products-container" id="productList"></main>

  <script>
    const products = [
      { id: 1, name: "Printed Silk Saree", category: "Women", price: 399, img: "https://via.placeholder.com/200/f43397/ffffff?text=EVTH+Saree" },
      { id: 2, name: "Men Cotton Casual Shirt", category: "Men", price: 299, img: "https://via.placeholder.com/200/333333/ffffff?text=EVTH+Shirt" },
      { id: 3, name: "Wireless Bluetooth Earbuds", category: "Electronics", price: 699, img: "https://via.placeholder.com/200/008080/ffffff?text=EVTH+Earbuds" },
      { id: 4, name: "Designer Anarkali Kurti", category: "Women", price: 499, img: "https://via.placeholder.com/200/f43397/ffffff?text=EVTH+Kurti" }
    ];

    let cartCount = 0;
    let selectedCategory = "All";

    const productList = document.getElementById("productList");
    const searchInput = document.getElementById("searchInput");
    const cartCountElement = document.getElementById("cartCount");

    function renderProducts(items) {
      productList.replaceChildren();

      if (items.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.textContent = "No products found.";
        productList.appendChild(emptyMessage);
        return;
      }

      items.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.src = product.img;
        image.alt = product.name;

        const details = document.createElement("div");
        const title = document.createElement("div");
        title.className = "product-title";
        title.textContent = product.name;
        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = `₹${product.price}`;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Free Delivery";
        details.append(title, price, badge);

        const addButton = document.createElement("button");
        addButton.className = "add-btn";
        addButton.type = "button";
        addButton.textContent = "Add to Cart";
        addButton.addEventListener("click", addToCart);

        card.append(image, details, addButton);
        productList.appendChild(card);
      });
    }

    function addToCart() {
      cartCount += 1;
      cartCountElement.textContent = cartCount;
    }

    function filterProducts() {
      const searchText = searchInput.value.toLowerCase().trim();
      const filtered = products.filter((product) => {
        const matchesCategory = selectedCategory === "All" || product.category === selectedCategory;
        const matchesSearch = product.name.toLowerCase().includes(searchText);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    document.querySelectorAll(".cat-btn").forEach((button) => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        document.querySelectorAll(".cat-btn").forEach((categoryButton) => {
          categoryButton.classList.toggle("active", categoryButton === button);
        });
        filterProducts();
      });
    });

    searchInput.addEventListener("input", filterProducts);
    renderProducts(products);
  </script>
</body>
</html>
